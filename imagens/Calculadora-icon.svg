<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Quatro operadores matemáticos em grade 2x2.
    Paleta: fundo #171B23, destaque #22998C.
  -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2430"/>
      <stop offset="100%" stop-color="#141821"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg2)"/>

  <g stroke-linecap="round" stroke-width="56">
    <!-- + (superior esquerdo) -->
    <g stroke="#E8EBEE">
      <line x1="264" y1="360" x2="424" y2="360"/>
      <line x1="344" y1="280" x2="344" y2="440"/>
    </g>

    <!-- − (superior direito), em destaque -->
    <line x1="600" y1="360" x2="760" y2="360" stroke="#22998C"/>

    <!-- × (inferior esquerdo), em destaque -->
    <g stroke="#22998C">
      <line x1="288" y1="608" x2="400" y2="720"/>
      <line x1="400" y1="608" x2="288" y2="720"/>
    </g>

    <!-- ÷ (inferior direito) -->
    <g stroke="#E8EBEE">
      <line x1="600" y1="664" x2="760" y2="664"/>
    </g>
  </g>
  <circle cx="680" cy="596" r="26" fill="#E8EBEE"/>
  <circle cx="680" cy="732" r="26" fill="#E8EBEE"/>
</svg>
